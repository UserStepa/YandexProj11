<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренажёр слепой печати</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      background: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 16px;
      min-height: 100vh;
    }

    /* HEADER */
    #site-header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 50px;
      background: #111111;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 1000;
    }

    #site-logo {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
    }
    #site-logo:hover { color: #cccccc; }

    .page { display: none; min-height: 100vh; }
    .page.active { display: flex; }

    #page-menu {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 50px;
    }

    .menu-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-menu {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background: #2d2d2d;
      border: 1px solid #555;
      padding: 0.9rem 2.5rem;
      cursor: pointer;
      width: 280px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .btn-menu:hover { background: #3a3a3a; }

    #page-typing {
      flex-direction: column;
      padding-top: 50px;
      align-items: center;
    }

    .typing-header {
      width: 100%;
      max-width: 860px;
      padding: 1.2rem 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .typing-main {
      width: 100%;
      max-width: 860px;
      padding: 1.5rem;
    }

    .typing-arena {
      position: relative;
      background: #111111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 1.5rem;
      min-height: 100px;
    }

    .text-layer {
      line-height: 1.9;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      padding: 0;
    }

    #ghost-text {
      color: #444;
      position: absolute;
      top: 1.5rem; left: 1.5rem; right: 1.5rem;
      z-index: 1;
      pointer-events: none;
    }

    #typed-overlay {
      color: #ffffff;
      position: absolute;
      top: 1.5rem; left: 1.5rem; right: 1.5rem;
      z-index: 2;
      pointer-events: none;
    }

    #height-ref-text { visibility: hidden; pointer-events: none; user-select: none; }

    #ghost-text .gc.error { color: #cc3333; }
    #ghost-text .gc.cursor-pos {
      border-left: 2px solid #ffffff;
      animation: cur-blink 0.9s step-end infinite;
    }
    @keyframes cur-blink { 0%,100%{border-color:#ffffff} 50%{border-color:transparent} }

    #typing-input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent;
      z-index: 3;
      resize: none;
      padding: 1.5rem;
    }

    .stats-bar {
      display: flex; gap: 1.5rem; color: #aaa; font-size: 0.85rem;
    }
    .stat { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
    .stat-value { color: #fff; font-weight: bold; font-size: 1.1rem; }

    #loading-overlay {
      display: none;
      position: absolute; inset: 0; background: #111; z-index: 10;
      align-items: center; justify-content: center; flex-direction: column;
    }
    #loading-overlay.active { display: flex; }

    .progress-bar-wrap { height: 3px; background: #333; margin-top: 10px; overflow: hidden; }
    #progress-bar { height: 100%; width: 0%; background: #666; transition: width 0.2s; }

    .typing-controls { display: flex; gap: 10px; margin-top: 20px; }
    .btn-ctrl { background: #2d2d2d; border: 1px solid #444; color: #ccc; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
    .btn-back { background: transparent; border: 1px solid #333; color: #888; padding: 8px 16px; cursor: pointer; border-radius: 4px; }

    #completion-banner {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(17,17,17,0.93);
      align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem;
    }
    #completion-banner.active { display: flex; }
    .banner-title { font-size: 2rem; font-weight: bold; }
    .banner-stats { display: flex; gap: 3rem; }
    .banner-stat { display: flex; flex-direction: column; align-items: center; }
    .banner-stat .val { font-size: 1.8rem; font-weight: bold; }

    #wip-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 300;
      background: rgba(17,17,17,0.92);
      align-items: center; justify-content: center; cursor: pointer;
    }
    #wip-overlay.active { display: flex; }
  </style>
</head>
<body>

  <header id="site-header">
    <div id="site-logo" onclick="showPage('menu')">ТРЕНАЖЁР СЛЕПОЙ ПЕЧАТИ</div>
  </header>

  <div id="page-menu" class="page active">
    <div class="menu-title">Тренажёр слепой печати</div>
    <div class="menu-buttons">
      <button class="btn-menu" onclick="startNormalMode()">ОБЫЧНЫЙ РЕЖИМ</button>
      <button class="btn-menu muted" onclick="showWip()">СКОРОСТНОЙ РЕЖИМ</button>
    </div>
  </div>

  <div id="page-typing" class="page">
    <div class="typing-header">
      <div class="source-info">Источник: <a id="article-link" href="#" target="_blank">—</a></div>
      <div class="stats-bar">
        <div class="stat"><span class="stat-label">Символы</span><span class="stat-value" id="stat-chars">0</span></div>
        <div class="stat"><span class="stat-label">Ошибки</span><span class="stat-value" id="stat-errors">0</span></div>
        <div class="stat"><span class="stat-label">Точность</span><span class="stat-value" id="stat-acc">100%</span></div>
      </div>
    </div>

    <div class="typing-main">
      <div class="typing-arena" id="typing-arena">
        <div id="loading-overlay" class="active">Загрузка...</div>
        <div id="height-ref-text" class="text-layer"></div>
        <div id="ghost-text" class="text-layer"></div>
        <div id="typed-overlay" class="text-layer"></div>
        <textarea id="typing-input" spellcheck="false"></textarea>
      </div>
      <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
      <div class="typing-controls">
        <button class="btn-ctrl" onclick="loadNewText()">Новый текст</button>
        <button class="btn-ctrl" onclick="resetTyping()">Заново</button>
        <button class="btn-back" onclick="showPage('menu')">← Меню</button>
      </div>
    </div>
  </div>

  <div id="completion-banner">
    <div class="banner-title">Вы справились!</div>
    <div class="banner-stats">
      <div class="banner-stat"><span class="val" id="final-chars">0</span><span>символов</span></div>
      <div class="banner-stat"><span class="val" id="final-errors">0</span><span>ошибок</span></div>
      <div class="banner-stat"><span class="val" id="final-acc">100%</span><span>точность</span></div>
    </div>
    <button class="btn-ctrl" onclick="closeBanner()">Новый текст</button>
  </div>

  <div id="wip-overlay" onclick="closeWip()">
    <div class="wip-box" style="text-align:center;">
      <div class="banner-title">В РАЗРАБОТКЕ</div>
      <div style="color:#666;">Нажмите, чтобы закрыть</div>
    </div>
  </div>

  <script>
    let targetText = '';
    let typedText = '';
    let errorCount = 0;
    let startTime = null;
    let completed = false;

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
    }

    function startNormalMode() {
      showPage('typing');
      loadNewText();
    }

    function showWip() { document.getElementById('wip-overlay').classList.add('active'); }
    function closeWip() { document.getElementById('wip-overlay').classList.remove('active'); }

    async function loadNewText() {
      resetState();
      document.getElementById('loading-overlay').classList.add('active');
      try {
        const res = await fetch('/api/text');
        const data = await res.json();
        targetText = data.text.replace(/\r/g, '');
        document.getElementById('article-link').textContent = data.source || 'Wikipedia';
        document.getElementById('article-link').href = data.url || '#';
        renderLayers();
        document.getElementById('loading-overlay').classList.remove('active');
      } catch (e) { alert('Ошибка загрузки'); }
    }

    function renderLayers() {
      const ghost = document.getElementById('ghost-text');
      const ref = document.getElementById('height-ref-text');
      ghost.innerHTML = '';
      ref.textContent = targetText;

      for (let i = 0; i < targetText.length; i++) {
        const span = document.createElement('span');
        span.className = 'gc';
        span.textContent = targetText[i];
        ghost.appendChild(span);
      }
      updateCursor();
    }

    function updateCursor() {
      const spans = document.getElementById('ghost-text').children;
      for (let s of spans) s.classList.remove('cursor-pos');
      if (spans[typedText.length]) spans[typedText.length].classList.add('cursor-pos');
    }

    function resetState() {
      typedText = '';
      errorCount = 0;
      startTime = null;
      completed = false;
      document.getElementById('typed-overlay').textContent = '';
      document.getElementById('stat-chars').textContent = '0';
      document.getElementById('stat-errors').textContent = '0';
      document.getElementById('stat-acc').textContent = '100%';
      document.getElementById('progress-bar').style.width = '0%';
      document.getElementById('completion-banner').classList.remove('active');
    }

    function resetTyping() { resetState(); renderLayers(); }

    document.getElementById('typing-input').addEventListener('input', (e) => {
      if (completed) return;
      const val = e.target.value;
      e.target.value = '';

      if (!startTime) startTime = Date.now();

      const pos = typedText.length;
      const nextChar = targetText[pos];
      const typed = val[val.length - 1];

      if (typed === nextChar) {
        typedText += nextChar;
        document.getElementById('typed-overlay').textContent = typedText;
        updateCursor();
        if (typedText.length === targetText.length) finishSession();
      } else {
        errorCount++;
        markError(pos);
      }
      updateStats();
    });

    function markError(pos) {
      const span = document.getElementById('ghost-text').children[pos];
      if (span) {
        span.classList.add('error');
        setTimeout(() => span.classList.remove('error'), 300);
      }
    }

    function updateStats() {
      document.getElementById('stat-chars').textContent = typedText.length;
      document.getElementById('stat-errors').textContent = errorCount;
      const total = typedText.length + errorCount;
      const acc = total > 0 ? Math.round(typedText.length / total * 100) : 100;
      document.getElementById('stat-acc').textContent = acc + '%';
      document.getElementById('progress-bar').style.width = (typedText.length / targetText.length * 100) + '%';
    }

    function finishSession() {
      completed = true;
      const total = typedText.length + errorCount;
      const acc = total > 0 ? Math.round(typedText.length / total * 100) : 100;
      document.getElementById('final-chars').textContent = typedText.length;
      document.getElementById('final-errors').textContent = errorCount;
      document.getElementById('final-acc').textContent = acc + '%';
      document.getElementById('completion-banner').classList.add('active');
    }

    function closeBanner() { loadNewText(); }
  </script>
</body>
</html>
